name: Metrics

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: metrics
  cancel-in-progress: true

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    permissions:
      contents: write

    steps:
      - name: Generate GitHub metrics
        uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}

          user: richie-rich90454
          filename: metrics.svg
          template: classic

          base: header, activity, community, repositories, metadata
          config_timezone: America/Los_Angeles
          config_display: large

          # Lower batch size — 100 repos/query times out and returns 0.
          repositories: 100
          repositories_batch: 10
          repositories_affiliations: owner, collaborator, organization_member
          repositories_forks: yes

          quota_required_graphql: 500

          commits_authoring: >-
            richie-rich90454,
            rjiang880@gmail.com,
            zhiyu.jiang90454-bisz@basischina.com

          # Language analysis.
          plugin_languages: yes
          plugin_languages_indepth: no
          plugin_languages_sections: most-used
          plugin_languages_limit: 8
          plugin_languages_details: percentage
          plugin_languages_ignored: ""
          plugin_languages_other: yes
          # Merge TSX → TypeScript and JSX → JavaScript.
          plugin_languages_aliases: >-
            tsx:TypeScript,
            jsx:JavaScript

          plugin_followup: yes
          plugin_followup_indepth: no

          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year

          plugin_stars: yes
          plugin_stars_limit: 5

          plugin_habits: no

          plugins_errors_fatal: yes
          debug: yes
