name: Metrics

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Generate GitHub metrics
        # gh-metrics/metrics@master == v3.35.0-beta, which fixes the
        # v3.34 pagination bug that stopped at one batch.
        uses: gh-metrics/metrics@master
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}

          user: richie-rich90454
          filename: metrics.svg
          template: classic

          base: header, activity, community, repositories, metadata
          config_timezone: America/Los_Angeles
          config_display: large

          # Repository discovery. Both values must match.
          repositories: 100
          repositories_batch: 100
          repositories_affiliations: owner, collaborator, organization_member
          repositories_forks: yes

          quota_required_graphql: 500

          retries: 3
          retries_delay: 5000

          commits_authoring: >-
            richie-rich90454,
            rjiang880@gmail.com,
            zhiyu.jiang90454-bisz@basischina.com

          # ---------- Languages ----------
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_limit: 8
          plugin_languages_details: percentage
          plugin_languages_analysis_timeout: 15

          plugin_languages_ignored: >-
            html, css, powershell, plpgsql, shell, batchfile,
            makefile, dockerfile, cmake, qmake, gnuplot

          # Do NOT set plugin_languages_other. It merges every ignored
          # language into one "Other" bar that re-shows them.

          # ---------- Lines of code ----------
          plugin_lines: yes
          plugin_lines_sections: base
          plugin_lines_repositories_limit: 4

          # ---------- Traffic ----------
          plugin_traffic: yes

          # ---------- Issue / PR overview ----------
          plugin_followup: yes
          plugin_followup_indepth: yes
          plugin_followup_sections: repositories

          # ---------- Commit activity graph ----------
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year

          # ---------- Recently starred ----------
          plugin_stars: yes
          plugin_stars_limit: 4

          # ---------- Layout ----------
          config_order: >-
            base.header, languages, lines, traffic, stars, followup,
            community, activity, isocalendar, metadata

          plugins_errors_fatal: yes
          debug: yes
