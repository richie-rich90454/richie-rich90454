name: Metrics

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Generate GitHub metrics
        uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}

          user: richie-rich90454
          filename: metrics.svg
          template: classic

          base: header, activity, community, repositories, metadata
          config_timezone: America/Los_Angeles
          config_display: large

          # Keep the SVG small.
          config_base64: no
          config_animations: no
          optimize: css, xml

          # Repository discovery.
          # Lower batch so the base plugin doesn't time out on accounts
          # with many repositories. Check the log line
          # "base > loaded N repositories" after running.
          repositories: 100
          repositories_batch: 10
          repositories_affiliations: owner, collaborator, organization_member
          repositories_forks: yes

          quota_required_graphql: 500

          commits_authoring: >-
            richie-rich90454,
            rjiang880@gmail.com,
            zhiyu.jiang90454-bisz@basischina.com

          # Language analysis.
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_limit: 8
          plugin_languages_details: percentage
          plugin_languages_analysis_timeout: 15

          # Directly exclude HTML and CSS.
          plugin_languages_ignored: html, css

          # CRITICAL: do NOT enable this. Setting it to "yes" merges
          # every ignored language into a single "Other" slice, which
          # both shows the languages you wanted hidden AND eats one of
          # your 8 display slots. Leave it off (default is no).
          # plugin_languages_other: yes   <-- REMOVED

          # Merge TSX into TypeScript and JSX into JavaScript.
          plugin_languages_aliases: >-
            tsx:TypeScript,
            jsx:JavaScript

          plugin_followup: yes
          plugin_followup_indepth: yes
          plugin_followup_sections: repositories

          plugin_lines: yes
          plugin_lines_sections: base
          plugin_lines_repositories_limit: 4

          plugin_people: yes
          plugin_people_limit: 24
          plugin_people_size: 28
          plugin_people_types: followers
          plugin_people_shuffle: yes

          plugin_introduction: yes
          plugin_introduction_title: yes

          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year

          plugin_habits: no

          config_order: >-
            base.header, introduction, languages, lines, people,
            followup, community, activity, isocalendar, metadata

          plugins_errors_fatal: yes
          debug: yes
