name: Metrics

on:
  # Run once per day at 00:00 UTC.
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Generate GitHub metrics
        uses: gh-metrics/metrics@master
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}

          user: richie-rich90454
          filename: metrics.svg
          template: classic

          base: header, activity, community, repositories, metadata
          config_timezone: America/Los_Angeles
          config_display: large

          # Repository discovery.
          # Batch of 10 prevents the GraphQL timeout that returns 0
          # repositories on accounts with many repos.
          repositories: 100
          repositories_batch: 10
          repositories_affiliations: owner, collaborator, organization_member
          repositories_forks: yes
          quota_required_graphql: 500

          commits_authoring: >-
            richie-rich90454,
            rjiang880@gmail.com,
            zhiyu.jiang90454-bisz@basischina.com

          # Language analysis.
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_limit: 8
          plugin_languages_details: percentage
          plugin_languages_analysis_timeout: 15

          # Languages to drop from the chart entirely.
          #   html, css              -- markup
          #   tsx, jsx               -- keep them out of TypeScript /
          #                             JavaScript so those two don't
          #                             dominate the whole pie
          #   powershell, plpgsql,
          #   shell, batchfile,
          #   makefile, dockerfile,
          #   cmake, qmake, gnuplot  -- scripting / build config
          plugin_languages_ignored: >-
            html, css, tsx, jsx, powershell, plpgsql, shell,
            batchfile, makefile, dockerfile, cmake, qmake, gnuplot

          # Do NOT set plugin_languages_other. Setting it to yes
          # merges every ignored language into a single "Other" slice,
          # which re-shows the languages you just hid and eats one of
          # your 8 display slots.

          # Do NOT set plugin_languages_aliases. Aliasing tsx -> ts or
          # jsx -> js is what was inflating TypeScript and JavaScript.

          plugin_followup: yes
          plugin_followup_indepth: yes
          plugin_followup_sections: repositories

          plugin_lines: yes
          plugin_lines_sections: base
          plugin_lines_repositories_limit: 4

          # Followers / people section removed.

          plugin_traffic: yes
          plugin_introduction: yes
          plugin_introduction_title: yes

          config_order: >-
            base.header, introduction, languages, lines, traffic,
            followup, community, activity, metadata

          plugins_errors_fatal: yes
          debug: yes
