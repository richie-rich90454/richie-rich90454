name: Metrics

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: metrics
  cancel-in-progress: true

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    permissions:
      contents: write

    steps:
      - name: Generate GitHub metrics
        uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}

          user: richie-rich90454
          filename: metrics.svg
          template: classic

          base: header, activity, community, repositories, metadata
          config_timezone: America/Los_Angeles
          config_display: large

          # Repository discovery.
          # 200 is a practical upper bound, not unlimited discovery.
          repositories: 200
          repositories_batch: 100
          repositories_affiliations: owner, collaborator, organization_member
          repositories_forks: yes

          # Keep the quota guard to avoid starting when the remaining
          # GraphQL quota is below this configured threshold.
          quota_required_graphql: 500

          # Match your known commit identities.
          commits_authoring: >-
            richie-rich90454,
            rjiang880@gmail.com,
            zhiyu.jiang90454-bisz@basischina.com

          # Main language breakdown only.
          # In-depth cloning and commit analysis are disabled.
          plugin_languages: yes
          plugin_languages_indepth: no
          plugin_languages_sections: most-used
          plugin_languages_limit: 8
          plugin_languages_details: percentage
          plugin_languages_ignored: ""
          plugin_languages_other: yes
          plugin_languages_aliases: >-
            tsx:TypeScript,
            jsx:JavaScript

          # Follow-up activity.
          plugin_followup: yes
          plugin_followup_indepth: no

          # Contribution calendar.
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          # Starred repositories.
          plugin_stars: yes
          plugin_stars_limit: 5

          # Do not spend resources on coding-habit analysis.
          plugin_habits: no

          plugins_errors_fatal: yes
          debug: yes
